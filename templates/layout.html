html<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gclass System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <h2>Hospital Management</h2>
        </div>
        <nav>
            <a href="/?class=Hospital">Hospitais</a>
            <a href="/?class=Department">Departamentos</a>
            <a href="/?class=Device">Dispositivos</a>
            <a href="/?class=Utilization">Utilizações</a>
            <a href="/stats">Estatísticas</a>
        </nav>
    </header>

    <div class="main-content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div style="padding: 15px; border-radius: 8px; margin-bottom: 20px;
                            background: {{ '#dcfce7' if category=='success' else '#fee2e2' }};
                            color: {{ '#166534' if category=='success' else '#991b1b' }};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
