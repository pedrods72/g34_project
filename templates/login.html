{% extends "layout.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 35px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1); border-radius: 12px; background: #ffffff;">
        
        <h2 style="margin-top: 0; margin-bottom: 8px; text-align: center; color: #1e293b; font-weight: 700;">Bem-vindo</h2>
        <p style="margin-top: 0; margin-bottom: 25px; text-align: center; color: #64748b; font-size: 0.9em;">Introduza as suas credenciais para aceder ao sistema.</p>
        
        <form id="form" action="/chklogin" method="post" style="display: flex; flex-direction: column; gap: 20px;">
            
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label for="user" style="font-weight: 600; color: #334155; font-size: 0.9em;">Utilizador</label>
                <input type="text" id="user" name="user" value="{{ user if user else '' }}" placeholder="Ex: user123" required 
                       style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95em; width: 100%; box-sizing: border-box;">
            </div>
            
            <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                <label for="password" style="font-weight: 600; color: #334155; font-size: 0.9em;">Palavra-passe</label>
                <input type="password" id="password" name="password" placeholder="Ex: password321" required 
                       style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95em; width: 100%; box-sizing: border-box;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 10px; padding: 14px; font-weight: 600; font-size: 1em; cursor: pointer; border-radius: 8px; width: 100%;">
                Entrar no Painel
            </button>
        </form>

        {# Mostra caixas de erro estilizadas se falhar o login #}
        {% if resul and resul != 'Valid' %}
            <div style="margin-top: 20px; padding: 12px; background-color: #fee2e2; border-left: 4px solid #ef4444; border-radius: 6px; color: #991b1b; text-align: left; font-size: 0.9em; font-weight: 500;">
                <strong>Erro:</strong> {{ resul }}
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
